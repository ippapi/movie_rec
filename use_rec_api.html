<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Movie Recommendation</title>
</head>
<body>
  <h1>Movie Recommendation Demo</h1>

  <label for="userId">Enter user ID:</label>
  <input type="text" id="userId" placeholder="e.g. 1" />

  <label for="topK">Top K recommendations:</label>
  <input type="number" id="topK" placeholder="e.g. 5" value="5" min="1" />

  <button id="submitBtn">Get Recommendations</button>

  <pre id="output"></pre>

  <script>
    const API_URL = "https://d6a9c5d17a87.ngrok-free.app/recommend";

    document.getElementById("submitBtn").addEventListener("click", async () => {
      const userId = document.getElementById("userId").value.trim();
      const topK = parseInt(document.getElementById("topK").value) || 10;

      if (!userId) {
        document.getElementById("output").textContent = "Please enter a user ID!";
        return;
      }

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            user_id: userId,
            top_k: topK
          })
        });

        const data = await response.json();

        if (!response.ok) {
          document.getElementById("output").textContent =
            `Error ${response.status}: ${JSON.stringify(data)}`;
          return;
        }

        if (data.recommendations?.length) {
          const list = data.recommendations
            .map((m, i) => `${i + 1}. ${m.title} (Score: ${m.score.toFixed(2)})`)
            .join("\n");
          document.getElementById("output").textContent =
            `Recommendations for user ${data.user_id}:\n${list}`;
        } else {
          document.getElementById("output").textContent =
            `No recommendations found for user ${data.user_id}.`;
        }

      } catch (error) {
        document.getElementById("output").textContent = `Network error: ${error.message}`;
      }
    });
  </script>
</body>
</html>
